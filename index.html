<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waffengewalt-Monitoring Deutschland</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col">
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Waffengewalt-Monitoring DE</h1>
        <p class="text-xs text-slate-400">Automatisiert &amp; DSGVO-konform</p>
    </header>
    <main class="flex-1 p-6 max-w-4xl mx-auto w-full space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <h2 id="headline" class="text-2xl font-bold">Lade Vorfälle...</h2>
            <p id="subtext" class="text-slate-400 text-sm mt-1">Die Daten werden aus der JSON-Datenbank geladen.</p>
        </div>
        <div id="incidents-list" class="space-y-4"></div>
    </main>
    <script>
        let incidents = [];
        async function loadData() {
            try {
                const response = await fetch('data/incidents.json');
                incidents = await response.json();
                render(incidents);
            } catch (e) {
                document.getElementById('headline').innerText = "Keine Daten gefunden";
                document.getElementById('subtext').innerText = "Bitte lade die incidents.json im Ordner 'data' hoch.";
            }
        }
        function render(data) {
            document.getElementById('headline').innerText = `${data.length} gemeldete Vorfälle`;
            const container = document.getElementById('incidents-list');
            container.innerHTML = data.map(item => `
                <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 space-y-2">
                    <div class="flex justify-between text-xs text-red-400 font-semibold">
                        <span>${item.date}</span>
                        <span>${item.city}</span>
                    </div>
                    <h3 class="font-bold text-white">${item.title}</h3>
                    <p class="text-sm text-slate-300">${item.description}</p>
                </div>
            `).join('');
        }
        loadData();
    </script>
</body>
</html>
