name: Polizeibericht Scraper

on:
  schedule:
    - cron: '0 */2 * * *' # Läuft alle 2 Stunden automatisch
  workflow_dispatch: # Ermöglicht auch den manuellen Test-Klick

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Skript ausführen
        run: python scraper.py

      - name: Änderungen speichern und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json
          git commit -m "Automatisches Update der Vorfälle [skip ci]" || exit 0
          git push